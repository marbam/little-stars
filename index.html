<!doctype html>
<html lang="en-GB">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Little Stars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Andika is a font designed for early readers. If offline, it falls back to Comic Sans. -->
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app"></div>
    <div id="overlay" hidden></div>

    <!-- Core -->
    <script src="js/core/ui.js"></script>
    <script src="js/core/sound.js"></script>
    <script src="js/core/speech.js"></script>
    <script src="js/core/registry.js"></script>
    <script src="js/core/stickers.js"></script>

    <!-- Pack: Starter (Under 5s) -->
    <script src="js/packs/starter/counting.js"></script>
    <script src="js/packs/starter/letters.js"></script>
    <script src="js/packs/starter/balloons.js"></script>
    <script src="js/packs/starter/shapes.js"></script>
    <script src="js/packs/starter/pairs.js"></script>
    <script src="js/packs/starter/paint.js"></script>
    <script src="js/packs/starter/pack.js"></script>

    <!-- Pack: Big Steps (Ages 4–5) -->
    <script src="js/packs/bigsteps/common.js"></script>
    <script src="js/packs/bigsteps/ispy.js"></script>
    <script src="js/packs/bigsteps/soundout.js"></script>
    <script src="js/packs/bigsteps/rhyme.js"></script>
    <script src="js/packs/bigsteps/moreless.js"></script>
    <script src="js/packs/bigsteps/onemore.js"></script>
    <script src="js/packs/bigsteps/pattern.js"></script>
    <script src="js/packs/bigsteps/pack.js"></script>

    <!-- Pack: Clever Clogs (Ages 4–5). Uses the Big Steps helpers, so it comes after them. -->
    <script src="js/packs/cleverclogs/findnumber.js"></script>
    <script src="js/packs/cleverclogs/dice.js"></script>
    <script src="js/packs/cleverclogs/share.js"></script>
    <script src="js/packs/cleverclogs/wordbuilder.js"></script>
    <script src="js/packs/cleverclogs/myname.js"></script>
    <script src="js/packs/cleverclogs/oddoneout.js"></script>
    <script src="js/packs/cleverclogs/pack.js"></script>

    <!-- Boot (must be last) -->
    <script src="js/core/app.js"></script>
</body>
</html>
